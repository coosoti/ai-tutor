[project]
name = "ai-tutor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "coosoti", email = "charlesosoti@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.5",
    "langchain-google-genai>=4.4.1",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
ai-tutor = "ai_tutor:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
